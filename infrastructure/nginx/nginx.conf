events {
    worker_connections 1024;
}

http {
    include mime.types;
    # nginx's stock mime.types has no entry for .webmanifest -- without this,
    # it falls back to default_type (application/octet-stream), and some
    # browsers silently ignore a web app manifest served with the wrong
    # content-type when deciding whether "Aggiungi a schermata Home" gets a
    # real icon. Confirmed live on lialenergy.it before this fix.
    types {
        application/manifest+json webmanifest;
    }
    default_type application/octet-stream;
    sendfile on;
    client_max_body_size 25m;

    # Docker's embedded DNS (127.0.0.11) resolves service names to the
    # CURRENT container IP. A static `upstream { server dashboard:3000; }`
    # block only resolves once, at nginx startup/reload -- if the dashboard
    # or api container is later recreated (new deploy, restart) with a new
    # IP, nginx keeps proxying to the old, now-dead IP until manually
    # reloaded (see docs/implementation-progress.md, hit twice already).
    # Using a variable in proxy_pass instead forces nginx to re-resolve
    # through this resolver on every request (subject to the `valid` TTL),
    # so container recreation no longer requires a manual nginx reload.
    resolver 127.0.0.11 valid=10s;

    # Port 80: only the ACME challenge (for Let's Encrypt issuance/renewal) is
    # served here; everything else redirects to HTTPS. Session cookies are
    # marked Secure (see apps/dashboard/lib/session.ts) -- browsers silently
    # discard a Secure cookie set over plain HTTP, which is exactly why login
    # must happen over HTTPS, not a bug to work around by dropping Secure.
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Public marketing/landing site (separate from the app -- see
    # docs/server-migration-guide.md §6). Static files only, no proxying;
    # the "Accedi" button in the page itself links straight to
    # https://app.lialenergy.it/login for the actual management app.
    server {
        listen 443 ssl;
        server_name lialenergy.it www.lialenergy.it;

        ssl_certificate     /etc/letsencrypt/live/lialenergy.it/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/lialenergy.it/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        root /usr/share/nginx/marketing;
        index index.html;
    }

    server {
        listen 443 ssl default_server;
        # app.lialenergy.it is the real app domain; the other two names are
        # kept as aliases so direct-IP access and the old temporary Hetzner
        # rDNS hostname keep working during the transition (see
        # docs/server-migration-guide.md §6 "Dominio e HTTPS").
        server_name app.lialenergy.it static.164.127.225.46.clients.your-server.de _;

        ssl_certificate     /etc/letsencrypt/live/app.lialenergy.it/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/app.lialenergy.it/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Baseline security headers, site-wide. No CSP here deliberately --
        # Next.js's own inline hydration/RSC payload scripts would need a
        # nonce-based CSP to not break the app, which is a larger change to
        # get right; a wrong CSP breaks the live site rather than just being
        # a missed hardening item, so it's tracked as a follow-up instead of
        # guessed at here (see docs/security-model.md).
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        # Direct backend access (OpenAPI docs, external integrations) lives under
        # /backend/ -- deliberately NOT /api/, because the dashboard's own BFF
        # route handlers already own /api/* (see apps/dashboard/app/api/**). The
        # browser is only ever supposed to talk to the dashboard (BFF pattern,
        # see docs/security-model.md) -- this route exists for developer
        # convenience, not for the app's own request flow.
        location /backend/ {
            # Deliberately a STATIC proxy_pass target here (no variable),
            # unlike the dashboard's own location / below -- nginx only does
            # its automatic "/backend/" prefix-stripping (matching the
            # location prefix against the proxy_pass URI) when proxy_pass has
            # no variable in it; with a variable, nginx instead forwards the
            # ORIGINAL unstripped request URI, which every FastAPI route then
            # 404s on (confirmed live: /backend/health forwarded literally as
            # "/backend/health", which doesn't exist as a route). Combining a
            # variable proxy_pass with a manual `rewrite ... break` to
            # compensate hit a separate, real nginx bug ("invalid URL prefix
            # in http://" on every single request, also confirmed live).
            # Trade-off: this path needs an nginx restart if the api
            # container is ever recreated with a new IP (same caveat the
            # dashboard proxy below solves with a variable) -- acceptable
            # here since /backend/ is developer/admin convenience access, not
            # the app's own request flow.
            proxy_pass http://api:8000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Public read-only access to the "lial-media" bucket (profile/product
        # photos -- see app/core/storage.py) -- MinIO itself is not reachable
        # from outside the docker network, this is the only path a browser
        # has to load an uploaded photo. Static proxy_pass target for the
        # same reason /backend/ is static, not a variable (see that
        # location's comment) -- and there is no equivalent "prefix strip"
        # need here since the bucket name IS the next path segment MinIO
        # expects (GET /<bucket>/<key>), so /media/ is simply dropped and the
        # rest forwarded as-is.
        location /media/ {
            rewrite ^/media/(.*)$ /lial-media/$1 break;
            proxy_pass http://minio:9000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Private, presigned-only access to the "lial-documents" bucket
        # (identity/fiscal-code/utility-bill/chamber-of-commerce uploads --
        # see app/domains/documents/). Unlike /media/ above, this bucket has
        # NO public bucket policy at all -- MinIO rejects every request here
        # UNLESS its query string carries a valid, time-limited SigV4
        # signature (core/storage.py::generate_presigned_document_url()).
        # No `rewrite` needed: the location prefix already matches the bucket
        # name, so the request URI is forwarded byte-for-byte. The Host
        # header is forced to match the INTERNAL endpoint
        # (http://minio:9000) the presigning client used to compute that
        # signature -- MinIO's SigV4 verification includes Host, so if nginx
        # forwarded the public domain's Host instead, every presigned URL
        # would 403 with SignatureDoesNotMatch regardless of validity.
        location /lial-documents/ {
            proxy_pass http://minio:9000;
            proxy_http_version 1.1;
            proxy_set_header Host minio:9000;
        }

        location / {
            set $dashboard_upstream dashboard:3000;
            proxy_pass http://$dashboard_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
