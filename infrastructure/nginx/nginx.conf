events {
    worker_connections 1024;
}

http {
    sendfile on;
    client_max_body_size 25m;

    upstream dashboard_upstream {
        server dashboard:3000;
    }

    upstream api_upstream {
        server api:8000;
    }

    # Port 80: only the ACME challenge (for Let's Encrypt issuance/renewal) is
    # served here; everything else redirects to HTTPS. Session cookies are
    # marked Secure (see apps/dashboard/lib/session.ts) -- browsers silently
    # discard a Secure cookie set over plain HTTP, which is exactly why login
    # must happen over HTTPS, not a bug to work around by dropping Secure.
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name _;

        # Domain is hardcoded here (not templated) because this is a specific
        # server's config, not a generic template -- if the domain changes
        # (e.g. a real domain replaces this temporary Hetzner rDNS one), update
        # this path AND re-run certbot for the new name (see
        # docs/server-migration-guide.md §6 "Dominio e HTTPS").
        ssl_certificate     /etc/letsencrypt/live/static.164.127.225.46.clients.your-server.de/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/static.164.127.225.46.clients.your-server.de/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Direct backend access (OpenAPI docs, external integrations) lives under
        # /backend/ -- deliberately NOT /api/, because the dashboard's own BFF
        # route handlers already own /api/* (see apps/dashboard/app/api/**). The
        # browser is only ever supposed to talk to the dashboard (BFF pattern,
        # see docs/security-model.md) -- this route exists for developer
        # convenience, not for the app's own request flow.
        location /backend/ {
            rewrite ^/backend/(.*)$ /$1 break;
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://dashboard_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
